:root{
  --bg:#dedbd2; --panel:#e9e6de; --panel2:#d3cfc5; --ink:#161514; --ink2:#67645e; --ink3:#98948c;
  --hair:rgba(22,21,20,.13); --fill:rgba(22,21,20,.07); --field:rgba(255,255,255,.55);
  --accent:#e4451f; --accent-ink:#ffffff; --accent-soft:rgba(228,69,31,.13);
  --warn:#a86c08; --bad:#c2281a;
  --frost:rgba(233,230,222,.72); --frost-solid:#e9e6de; --frost-edge:rgba(255,255,255,.55);
  --shadow-hi:0 22px 60px -20px rgba(22,21,20,.38),0 2px 6px rgba(22,21,20,.06);
  --c1:#a9c1b6; --c2:#b9a07c; --c3:#ebe48c; --c4:#bab9b4; --c5:#e88247; --c6:#86a078; --c7:#dccdab; --on-color:#161514;
  --t-xs:11.5px; --t-sm:13.5px; --t-md:16px; --t-lg:21px; --t-xl:36px; --t-hero:92px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:36px; --r:26px; --r-sm:14px;
  --font:"Geist",-apple-system,BlinkMacSystemFont,"Helvetica Neue","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#141312; --panel:#1f1e1b; --panel2:#2a2824; --ink:#f0ede5; --ink2:#a9a59c; --ink3:#76726a;
    --hair:rgba(240,237,229,.13); --fill:rgba(240,237,229,.08); --field:rgba(240,237,229,.07);
    --accent:#f1582f; --accent-ink:#141312; --accent-soft:rgba(241,88,47,.16);
    --warn:#e3ad4e; --bad:#f2735f;
    --frost:rgba(38,36,32,.70); --frost-solid:#26241f; --frost-edge:rgba(255,255,255,.09);
    --shadow-hi:0 26px 70px -18px rgba(0,0,0,.8);
    --c1:#93ab9f; --c2:#a68d6a; --c3:#d6cf78; --c4:#a3a29d; --c5:#d6733c; --c6:#748e67; --c7:#c6b794;
    color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:var(--t-md);line-height:1.45;letter-spacing:-.006em;-webkit-font-smoothing:antialiased}
.glass{background:var(--panel)}
.glass-hi{background:var(--frost);-webkit-backdrop-filter:blur(30px) saturate(160%);backdrop-filter:blur(30px) saturate(160%);border:1px solid var(--frost-edge);box-shadow:var(--shadow-hi)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass-hi{background:var(--frost-solid)}}
@media (prefers-reduced-transparency: reduce){.glass-hi{background:var(--frost-solid);-webkit-backdrop-filter:none;backdrop-filter:none}}

#shell{position:relative;min-height:100vh;min-height:100dvh}
#side{display:none}
#col{max-width:620px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + var(--s4)) 20px calc(env(safe-area-inset-bottom,0px) + 124px)}

<script>

function whatifCalc(){
  const w = P().whatif, months = Math.round(w.years*12); let total = 0, paid = 0; const rows = [];

/* ---------- shell ---------- */
const VIEWS = {home:vHome, add:vAdd, pots:vPots, plan:vPlan, wealth:vWealth, whatif:vWhatif, backup:vBackup};
const TITLES = {home:'Left to spend', add:'Add a spend', pots:'Pots for the 1st', plan:'Your plan', wealth:'Savings and goals', whatif:'What if?', backup:'Backup and data'};
const TITLE2 = {home:'Left to<br>spend', add:'Add a<br>spend', pots:'Pots for<br>the 1st', plan:'Your<br>plan', wealth:'Savings<br>and goals', whatif:'What<br>if?', backup:'Backup<br>and data'};
const tab = () => { const t = location.hash.replace('#',''); return VIEWS[t] ? t : 'home'; };
function navHTML(){
  const t = tab(), a = (r, label, ic) => '<a href="#' + r + '"' + ((t === r || (r === 'wealth' && t === 'whatif' && false)) ? ' aria-current="page"' : '') + '>' + ico(ic || r) + '<span>' + label + '</span></a>';
  $('#side').innerHTML = '<div class="brand">My Budget</div><button class="searchbtn" data-act="search">' + ico('search') + 'Search<kbd>' + (/Mac|iPhone|iPad/.test(navigator.platform) ? '⌘K' : 'Ctrl K') + '</kbd></button>' +
    '<div class="grp">Every day</div>' + a('home','Home') + a('add','Add spend') + '<div class="grp">Every month</div>' + a('pots','Pots') + a('plan','Plan') + '<div class="grp">Now and then</div>' + a('wealth','Savings and goals') + a('whatif','What if?') + '<div class="spacer"></div>' + a('backup','Backup & data');
  const mt = t === 'whatif' ? 'wealth' : t;
  $('#tabs').innerHTML = [['home','Home'],['pots','Pots'],['add','Add a spend'],['plan','Plan'],['wealth','Savings']].map(x => '<a href="#' + x[0] + '"' + (x[0] === 'add' ? ' class="fab" aria-label="Add a spend"' : '') + (mt === x[0] ? ' aria-current="page"' : '') + '>' + (x[0] === 'add' ? '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>' : ico(x[0]) + x[1]) + '</a>').join('');
}
function render(){
  now = new Date(); curYM = iso(now).slice(0,7);
  const t = tab(); $('#title').innerHTML = TITLE2[t]; document.title = t === 'home' ? 'My Budget' : TITLES[t] + ' · My Budget';
  navHTML(); $('#view').innerHTML = VIEWS[t]();
  if (pendingJump){ const j = pendingJump; pendingJump = null; const el = document.getElementById(j); if (el){ const d = el.closest('details'); if (d) d.open = true; el.scrollIntoView({block:'center'}); el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1900); } }
}
function go(route, elId, accId){ if (accId) openAcc[accId] = true; pendingJump = elId || null; if (tab() === route) render(); else location.hash = route; }
let toastT = null;
function toast(msg, undo){ $('#toast-msg').textContent = msg; $('#toast-undo').hidden = !undo; $('#toast').classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => $('#toast').classList.remove('on'), undo ? 6000 : 2800); }

/* ---------- sheets ---------- */
let lastFocus = null;
function openSheet(html){ lastFocus = document.activeElement; $('#sheet').innerHTML = html; $('#scrim').classList.add('on'); const f = $('#sheet input, #sheet select, #sheet button'); (f || $('#sheet')).focus(); }
function closeSheet(noFocus){ $('#scrim').classList.remove('on'); $('#sheet').innerHTML = ''; pendingImport = null; if (!noFocus && lastFocus && lastFocus.focus) lastFocus.focus({preventScroll:true}); }
function sheetTx(id){
  const e = E().find(x => x.id === id); if (!e) return;
  openSheet('<h2>Edit spend</h2><form id="txform" data-id="' + esc(id) + '" class="stack"><label class="f" for="t-amt">Amount<input id="t-amt" class="amt" inputmode="decimal" value="' + e.a + '"></label>' +
    '<label class="f" for="t-cat">Category<select id="t-cat">' + allCats().map(c => '<option value="' + esc(c.id) + '"' + (c.id === e.c ? ' selected' : '') + '>' + esc(c.name) + '</option>').join('') + '</select></label>' +
    '<div class="grid2"><label class="f" for="t-date">Date<input id="t-date" type="date" value="' + esc(e.d) + '"></label><label class="f" for="t-note">Note<input id="t-note" maxlength="60" value="' + esc(e.n || '') + '"></label></div>' +
    '<button class="btn primary" type="submit">Save</button><div class="row"><button type="button" class="btn quiet danger" data-act="txdel" data-id="' + esc(id) + '">Delete</button><button type="button" class="btn quiet" data-act="close">Cancel</button></div></form>');
}
function sheetBal(){
  const sn = snaps(), last = sn[sn.length-1];
  openSheet('<h2>Update balances</h2><form id="balform" class="stack"><label class="f" for="b-date">Date<input id="b-date" type="date" value="' + iso(new Date()) + '"></label>' +
    P().accounts.map(a => '<label class="f" for="b-' + esc(a.id) + '">' + esc(a.name) + (a.kind === 'debt' ? ' (owed)' : a.kind === 'pension' ? ' (pension)' : '') + '<input id="b-' + esc(a.id) + '" class="amt" inputmode="decimal" data-acc="' + esc(a.id) + '" value="' + (last ? (+last.b[a.id] || 0) : '') + '"></label>').join('') +
    '<button class="btn primary" type="submit">Save balances</button><button type="button" class="btn quiet" data-act="close">Cancel</button></form>');
}

/* ---------- search ---------- */
let results = [], selIdx = 0;
function buildIndex(){
  const out = [];
  [['home','Home'],['add','Add spend'],['pots','Pots'],['plan','Plan'],['wealth','Savings and goals'],['whatif','What if?'],['backup','Backup & data']].forEach(p => out.push({g:'Screens', t:p[1], s:'', k:p[1], go:() => go(p[0])}));
  P().cats.forEach(c => out.push({g:'Categories', t:c.name, s:'Everyday spending', v:money0(c.amt), k:c.name, go:() => go('home','x-cat-'+c.id)}));
  P().yearly.forEach(c => out.push({g:'Categories', t:c.name, s:'Yearly pot', v:money0(c.amt), k:c.name, go:() => go('home','x-cat-'+c.id,'yearly')}));
  potList().forEach(p => out.push({g:'Pots', t:p.name, s:p.sub, v:money(p.amt), k:p.name + ' pot', go:() => go('pots','x-pot-'+p.key)}));
  P().bills.forEach(b => out.push({g:'Bills', t:b.name, s:'Bill', v:money(b.amt), k:b.name + ' bill', go:() => go('plan','x-bills-'+b.id,'bills')}));
  P().goals.forEach(g => out.push({g:'Goals', t:g.name, s:'Goal', v:money0(g.target), k:g.name + ' goal', go:() => go('wealth','x-goal-'+g.id)}));
  P().accounts.forEach(a => out.push({g:'Accounts', t:a.name, s:'Account', k:a.name + ' account', go:() => go('wealth','x-acc-'+a.id,'accounts')}));
  E().slice().sort((a,b) => a.d < b.d ? 1 : -1).forEach(e => out.push({g:'Spends', t:catName(e.c) + (e.n ? ' · ' + e.n : ''), s:niceDate(e.d), v:money(e.a), k:catName(e.c) + ' ' + (e.n || '') + ' ' + e.a + ' ' + niceDate(e.d) + ' ' + e.d + ' ' + MONTHS[+e.d.slice(5,7)-1], go:() => sheetTx(e.id)}));
  return out;
}
let INDEX = [];
function runSearch(q){
  const words = q.toLowerCase().trim().split(/\s+/).filter(Boolean);
  let hits = INDEX.filter(it => words.every(w => it.k.toLowerCase().indexOf(w) >= 0));
  if (!words.length) hits = INDEX.filter(it => it.g === 'Screens').concat(INDEX.filter(it => it.g === 'Spends').slice(0,5));
  const cap = {}; results = hits.filter(it => { cap[it.g] = (cap[it.g] || 0) + 1; return cap[it.g] <= (it.g === 'Spends' ? 25 : 8); });
  selIdx = 0; paintResults();
}
function paintResults(){
  let h = '', g = '';
  results.forEach((it,i) => { if (it.g !== g){ g = it.g; h += '<div class="gh">' + g + '</div>'; } h += '<button type="button" data-res="' + i + '"' + (i === selIdx ? ' class="sel"' : '') + '><span><span>' + esc(it.t) + '</span>' + (it.s ? '<br><span class="sub">' + esc(it.s) + '</span>' : '') + '</span>' + (it.v ? '<span class="val">' + it.v + '</span>' : '') + '</button>'; });
  $('#results').innerHTML = h || '<p class="hint" style="padding:16px 8px">Nothing found. Try a category, a note, an amount or a month.</p>';
  const s = $('#results .sel'); if (s) s.scrollIntoView({block:'nearest'});
}
function openSearch(){ INDEX = buildIndex(); openSheet('<label class="f" for="q" style="gap:0"><span style="position:absolute;left:-9999px">Search</span><input id="q" type="search" placeholder="Search spends, pots, goals, accounts" autocomplete="off" enterkeyhint="go"></label><div class="results" id="results"></div>'); runSearch(''); }
function pick(i){ const it = results[i]; if (!it) return; closeSheet(true); it.go(); }

/* ---------- backup and restore ---------- */
function exportData(){
  const stamp = iso(new Date()), name = 'my-budget-backup-' + stamp + '.json';
  const body = JSON.stringify({app:'my-budget', v:2, exported:new Date().toISOString(), plan:P(), log:DB.log, meta:{ts:DB.meta.ts}}, null, 1);
  const done = () => { DB.meta.lastBackup = Date.now(); try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch(e){} render(); toast('Backup saved'); };
  try {
    const file = new File([body], name, {type:'application/json'});
    if (navigator.canShare && navigator.canShare({files:[file]}) && /iPhone|iPad|iPod|Android/.test(navigator.userAgent)){ navigator.share({files:[file], title:'My Budget backup'}).then(done).catch(() => {}); return; }
  } catch(e){}
  const url = URL.createObjectURL(new Blob([body], {type:'application/json'})), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000); done();
}
function readImport(file){
  const fr = new FileReader();
  fr.onload = () => {
    let d = null; try { d = JSON.parse(fr.result); } catch(e){}
    if (!d || !d.plan){ toast('That file isn’t a My Budget backup'); return; }
    pendingImport = normDB({plan:d.plan, log:d.log, meta:d.meta});
    const n = pendingImport.log.entries.length, when = d.exported ? niceDate(String(d.exported).slice(0,10)) : 'an unknown date';
    const hold = pendingImport;
    openSheet('<h2>Bring in this backup?</h2><div class="stack"><p class="hint">Saved on ' + esc(when) + '. It holds ' + n + ' spend' + (n === 1 ? '' : 's') + ' and ' + hold.plan.snaps.length + ' balance update' + (hold.plan.snaps.length === 1 ? '' : 's') + '.</p>' +
      (hasData() ? '<button class="btn primary" data-act="merge">Merge with this device</button><button class="btn danger" data-act="replace">Replace everything here</button>' : '<button class="btn primary" data-act="replace">Bring it in</button>') + '<button class="btn quiet" data-act="close">Cancel</button></div>');
    pendingImport = hold;
  };
  fr.readAsText(file);
}
function mergeIn(b){
  const ids = {}; E().forEach(e => ids[e.id] = 1); b.log.entries.forEach(e => { if (!ids[e.id]) E().push(e); });
  const newer = (b.meta.ts || 0) > (DB.meta.ts || 0), mine = P().snaps, byDate = {};
  (newer ? mine.concat(b.plan.snaps) : b.plan.snaps.concat(mine)).forEach(s => byDate[s.d] = s);
  if (newer) DB.plan = normPlan(clone(b.plan));
  DB.plan.snaps = Object.keys(byDate).sort().map(k => byDate[k]);
}

/* ---------- events ---------- */
document.addEventListener('click', ev => {
  const res = ev.target.closest('[data-res]'); if (res){ pick(+res.dataset.res); return; }
  if (ev.target.id === 'scrim'){ closeSheet(); return; }
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, id = b.dataset.id, p = P();
  if (act === 'search') openSearch();
  else if (act === 'close') closeSheet();
  else if (act === 'prev' || act === 'next'){ const d = new Date(+viewYM.slice(0,4), +viewYM.slice(5,7) - 1 + (act === 'prev' ? -1 : 1), 1), ym = iso(d).slice(0,7); if (ym <= curYM){ viewYM = ym; render(); } }
  else if (act === 'cat'){ pickedCat = id; $$('.chips button').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.id === id))); }
  else if (act === 'tx') sheetTx(id);
  else if (act === 'txdel'){ const i = E().findIndex(e => e.id === id); if (i >= 0){ lastDeleted = {e:E()[i], i:i}; E().splice(i,1); save(); closeSheet(); render(); toast('Deleted', true); } }
  else if (act === 'pot'){ const arr = (p.potsDone[curYM] || []).slice(), i = arr.indexOf(id); if (i >= 0) arr.splice(i,1); else arr.push(id); p.potsDone = {}; p.potsDone[curYM] = arr; save(); render(); }
  else if (act === 'bal') sheetBal();
  else if (act === 'snapdel'){ if (!b.dataset.armed){ b.dataset.armed = '1'; b.textContent = 'Sure?'; return; } p.snaps = p.snaps.filter(s => s.d !== id); save(); render(); }
  else if (act === 'addrow'){ const k = b.dataset.list, row = {id:uid(), name:''}; if (k === 'accounts') row.kind = 'asset'; else row.amt = 0; if (k === 'cats') row.wk = true; p[k].push(row); save(); render(); const ins = $$('[data-list="' + k + '"][data-field="name"]'); if (ins.length) ins[ins.length-1].focus(); }
  else if (act === 'rm'){ if (!b.classList.contains('armed')){ b.classList.add('armed'); b.textContent = 'Sure'; return; } const k = b.dataset.list; p[k] = p[k].filter(r => r.id !== id); save(); render(); }
  else if (act === 'export') exportData();
  else if (act === 'restore'){ $('#file').value = ''; $('#file').click(); }
  else if (act === 'merge' && pendingImport){ mergeIn(pendingImport); save(); closeSheet(); go('home'); toast('Merged'); }
  else if (act === 'replace' && pendingImport){ const lb = DB.meta.lastBackup; DB = normDB(clone(pendingImport)); DB.meta.lastBackup = lb; save(); closeSheet(); go('home'); toast('Backup brought in'); }
  else if (act === 'erase'){ if (!b.dataset.armed){ b.dataset.armed = '1'; b.textContent = 'Tap again to erase everything'; return; } try { localStorage.removeItem(KEY); } catch(e){} DB = normDB(null); go('home'); toast('Erased'); }
});
document.addEventListener('toggle', ev => { const d = ev.target; if (d.dataset && d.dataset.acc) openAcc[d.dataset.acc] = d.open; }, true);
document.addEventListener('input', ev => {
  const el = ev.target, p = P();
  if (el.id === 'q'){ runSearch(el.value); return; }
  if (el.dataset.pay) p.pay = num(el.value);
  else if (el.dataset.list){ const r = p[el.dataset.list].find(x => x.id === el.dataset.id); if (!r) return; const f = el.dataset.field; r[f] = (f === 'name' || f === 'kind') ? el.value : num(el.value); }
  else if (el.dataset.wf){ p.whatif[el.dataset.wf] = el.dataset.wf === 'lumpTo' ? el.value : num(el.value); if (el.dataset.wf === 'years') $('#w-yl').textContent = p.whatif.years; }
  else if (el.dataset.wr){ const r = p.whatif.rows.find(x => x.id === el.dataset.wr); if (!r) return; r[el.dataset.field] = num(el.value); }
  else return;
  save();
  const ps = $('#plansum'); if (ps) ps.innerHTML = summaryHTML();
  const wo = $('#wout'); if (wo) wo.innerHTML = whatifOut();
});
document.addEventListener('submit', ev => {
  ev.preventDefault(); const f = ev.target;
  if (f.id === 'addform'){
    const a = num($('#f-amt').value); if (!(a > 0)){ toast('Type an amount first'); $('#f-amt').focus(); return; }
    E().push({id:uid(), d:$('#f-date').value || iso(new Date()), a:r2(a), c:pickedCat, n:$('#f-note').value.trim()}); save(); render(); toast('Added ' + money(a) + ' to ' + catName(pickedCat));
  } else if (f.id === 'txform'){
    const e = E().find(x => x.id === f.dataset.id), a = num($('#t-amt').value); if (!e) return; if (!(a > 0)){ toast('Type an amount first'); return; }
    e.a = r2(a); e.c = $('#t-cat').value; e.d = $('#t-date').value || e.d; e.n = $('#t-note').value.trim(); save(); closeSheet(); render(); toast('Saved');
  } else if (f.id === 'balform'){
    const d = $('#b-date').value || iso(new Date()), b = {}; f.querySelectorAll('[data-acc]').forEach(i => b[i.dataset.acc] = r2(num(i.value)));
    P().snaps = P().snaps.filter(s => s.d !== d); P().snaps.push({d:d, b:b}); save(); closeSheet(); render(); toast('Balances saved');
  }
});
document.addEventListener('keydown', ev => {
  if ((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === 'k'){ ev.preventDefault(); if ($('#q')) closeSheet(); else openSearch(); return; }
  const open = $('#scrim').classList.contains('on');
  if (ev.key === 'Escape' && open){ closeSheet(); return; }
  if (ev.key === '/' && !open && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){ ev.preventDefault(); openSearch(); return; }
  if ($('#q') && open){
    if (ev.key === 'ArrowDown'){ ev.preventDefault(); selIdx = Math.min(results.length-1, selIdx+1); paintResults(); }
    else if (ev.key === 'ArrowUp'){ ev.preventDefault(); selIdx = Math.max(0, selIdx-1); paintResults(); }
    else if (ev.key === 'Enter'){ ev.preventDefault(); pick(selIdx); }
  }
});
$('#file').addEventListener('change', ev => { const f = ev.target.files && ev.target.files[0]; if (f) readImport(f); });
$('#toast-undo').addEventListener('click', () => { if (lastDeleted){ E().splice(Math.min(lastDeleted.i, E().length), 0, lastDeleted.e); lastDeleted = null; save(); render(); $('#toast').classList.remove('on'); } });
window.addEventListener('hashchange', () => { const j = pendingJump; render(); if (!j) window.scrollTo(0,0); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && iso(new Date()).slice(0,7) !== curYM){ viewYM = iso(new Date()).slice(0,7); render(); } });

render();
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
